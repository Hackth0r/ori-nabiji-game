name: Validate Unity project

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repository-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Unity repository
        run: python Tools/validate_repository.py
