name: Import TA-Casual-Farm base

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-upstream.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream project
        run: |
          git clone --depth 1 https://github.com/CookieNoir/TA-Casual-Farm.git /tmp/upstream

      - name: Copy Unity project
        run: |
          rsync -a --exclude=".git" --exclude=".github" /tmp/upstream/ ./

      - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to import"
          else
            git commit -m "Import TA-Casual-Farm base project"
            git push origin main
          fi
